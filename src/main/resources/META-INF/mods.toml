modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Lucky Block - the mod this one fixes and balances. Everything goes through mixins into its drop
# pipeline and its luck-crafting recipe; without it this mod has nothing to do.
# ordering=NONE (not AFTER): mixins need no load ordering, and AFTER would create a sorting CYCLE
# in packs where a mod must load BEFORE lucky and AFTER us (e.g. Lucky Tools, which deploys a
# bundled addon before lucky scans addons/lucky): tools->lucky->tweaks->tools.
[[dependencies.${mod_id}]]
    modId="lucky"
    mandatory=true
    versionRange="[1.20.1-13.0,)"
    ordering="NONE"
    side="BOTH"
